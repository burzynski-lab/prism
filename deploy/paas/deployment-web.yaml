apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-web
  annotations:
    image.openshift.io/triggers: >-
      [{"from": {"kind": "ImageStreamTag", "name": "prism:latest"}, "fieldPath": "spec.template.spec.containers[?(@.name==\"web\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels: {component: web}
  template:
    metadata:
      labels: {component: web}
    spec:
      containers:
        - name: web
          image: prism:latest        # ImageStreamTag (lookupPolicy local), kept current by the trigger
          args: ["serve", "--port", "8080"]
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: prism-config}}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: prism-data}
