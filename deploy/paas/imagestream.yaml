# The cluster re-imports the GHCR tag on a schedule (OKD default ~15 min) and the
# image-change triggers on the deployments roll out the new image automatically,
# so a merged pull request reaches the site without anyone running oc.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: prism
spec:
  lookupPolicy:
    local: true
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: ghcr.io/burzynski-lab/prism:latest
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Local
