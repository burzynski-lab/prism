id: emerging-jets-delphes
title: Emerging jets with a track transformer tagger (Delphes ATLAS example)
short: Two large-radius jets tagged by a transformer on reconstructed tracks, in an ATLAS-like Delphes simulation. The example analysis of the surrogate method paper.
experiment: ATLAS-like (Delphes)
status: example
version: "0.5"
updated: 2026-11-11
contact: Jackson Burzynski <burzynski@ou.edu>
tags: [dark showers, emerging jets, long-lived particles, transformer tagger]
references:
  - {label: "ATLAS emerging jets search (arXiv:2505.02429)", url: "https://arxiv.org/abs/2505.02429"}
  - {label: "Emerging jets (Schwaller, Stolarski, Weiler)", url: "https://arxiv.org/abs/1502.05409"}
  - {label: "Dark showers Snowmass report", url: "https://arxiv.org/abs/2203.09503"}
signal_region: >-
  Delphes ATLAS-like simulation with an average of 60 pile-up interactions per bunch crossing and jet-area
  pile-up subtraction. At least two anti-kt R = 1.0 jets, reclustered from R = 0.4 particle-flow jets, with pT > 200 GeV and
  |eta| < 2.0, each above the working point of a transformer tagger acting on the reconstructed tracks
  inside the jet. The working point corresponds to a QCD jet rejection of 1000. The returned number is the
  fraction of events entering this signal region.
inputs:
  - HepMC2 or HepMC3 ASCII (optionally gzipped), pp collisions at 13.6 TeV, generator level with the full decay chain and production vertices in mm or cm.
  - Long-lived particles must be decayed by the generator (their decay products and vertices are what the surrogate reads).
  - Hadronization and decays switched on. No detector simulation and no pile-up overlay (the surrogate reads the hard scatter only; longitudinal positions are measured from the primary vertex, so the beam-spot position does not matter).
predictor:
  type: emerging_jets_transformer
  model: surrogate.pt
example: example.hepmc.gz          # 100 Pythia events, m(pi_d) = 10 GeV, ctau = 0.1 mm, for trying the service
default_max_events: 20000
max_events: 50000
training: >-
  Trained on 3.5M truth jets from Pythia 8.312 Hidden Valley events (Z' at 1.5 TeV to dark quarks, m(pi_d) = 5 GeV,
  c-tau = 0.01 to 5 mm), at the nominal m(pi_d)/Lambda_D = 0.5 and at 0.2 and 1.0, on generator seeds disjoint
  from those used for the tagger. Labels are the decisions of the tagger applied to Delphes tracks with ATLAS
  impact-parameter resolutions and 60 overlaid pile-up interactions. Per-jet AUC against the tagger decision 0.976
  on validation jets.
validation:
  - {sample: "m(pi_d) = 5 GeV, ctau = 0.1 mm (held-out events)", actual: 0.420, predicted: 0.430}
  - {sample: "m(pi_d) = 5 GeV, ctau = 1 mm (held-out events)", actual: 0.542, predicted: 0.541}
  - {sample: "m(pi_d) = 5 GeV, ctau = 0.1 mm, m_pi/Lambda = 0.7 (unseen)", actual: 0.343, predicted: 0.357}
  - {sample: "m(pi_d) = 5 GeV, ctau = 0.1 mm, m_pi/Lambda = 1.4 (unseen)", actual: 0.216, predicted: 0.221}
  - {sample: "m(pi_d) = 5 GeV, ctau = 0.1 mm, 3 dark flavours (unseen)", actual: 0.422, predicted: 0.431}
  - {sample: "m(pi_d) = 5 GeV, ctau = 0.1 mm, Z' at 3 TeV (unseen)", actual: 0.154, predicted: 0.161}
  - {sample: "m(pi_d) = 10 GeV, ctau = 0.1 mm (unseen)", actual: 0.438, predicted: 0.360}
  - {sample: "m(pi_d) = 2 GeV, ctau = 0.1 mm (unseen)", actual: 0.327, predicted: 0.418}
figures:
  - {file: sr_efficiency_m5.png, caption: "Signal-region efficiency versus dark-pion lifetime for the training model on held-out events, detector level versus surrogate."}
  - {file: sr_efficiency_m10.png, caption: "The same for a dark-pion mass of 10 GeV, never seen in training."}
  - {file: sr_efficiency_m2.png, caption: "The same for a dark-pion mass of 2 GeV, never seen in training."}
  - {file: sr_efficiency_scan_lambda.png, caption: "Dependence on the dark-sector confinement scale at fixed mass and lifetime. The points at 0.2 and 1.0 were used in training."}
  - {file: sr_efficiency_scan_mzp_ctau0.1mm.png, caption: "Dependence on the Z' mass at fixed lifetime. Only 1.5 TeV was used in training."}
  - {file: calibration_m5.png, caption: "Per-jet calibration of the surrogate probability on the training model."}
  - {file: tagger_roc.png, caption: "The detector-level tagger the surrogate approximates: QCD rejection versus signal efficiency."}
